<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>서컹크 뽑기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;800&family=Nanum+Myeongjo:wght@400;800&display=swap">
<style>
/* 고전 교육용 플래시 콘셉트: 파란 하늘 + 흰 구름 + 초록 언덕, 광택 공·주황 버튼, 노란 명조 숫자. 하나의 밝은 테마로 고정 */
:root{
  --sky-top:#3d6fd6; --sky-bot:#c4d8f6; --cloud:#e9f0fc; --hill:#2fa32a; --hill-2:#66e01a; --hill-dark:#17761a;
  --panel:#ffffff; --panel-2:#f2f7ff; --ink:#1a1a1a; --muted:#566070; --line:#7f9fd6;
  --ball:#16b916; --ball-dark:#007a00; --gold:#ffd400; --orange:#ff9a00; --orange-dark:#d06a00;
  --board:#24502a; --wood:#a8692b; --desk:#ffc94a; --desk-edge:#d98a00; --seat-off:#e4ecf9;
  --danger:#d3261b; --ok:#128a12; --accent:#ff9a00; --accent-ink:#2b1700; --board-ink:#ffffff;
  --fart:#a3d63a; --fart-2:#e3f7a0; --skunk:#1f1b18; --skunk-white:#ffffff;
  --display:"Nanum Myeongjo","Batang","AppleMyungjo",serif;
  --body:"Nanum Gothic","Dotum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--sky-top)}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-bot) 70%,var(--sky-bot));background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 150px;position:relative}
.scenery{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.scenery svg{position:absolute;left:0;bottom:0;width:100%;height:170px}
.cloud{position:absolute;background:var(--cloud);border-radius:999px;opacity:.85;filter:drop-shadow(0 2px 0 rgba(255,255,255,.4))}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:55%;height:150%;left:12%;bottom:30%}
.cloud::after{width:42%;height:120%;right:12%;bottom:35%}
.app{max-width:1240px;margin:0 auto;display:grid;gap:16px;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:34px;margin:0;color:var(--gold);letter-spacing:1px;
  text-shadow:-2px -2px 0 #6a4a00,2px -2px 0 #6a4a00,-2px 2px 0 #6a4a00,2px 2px 0 #6a4a00,0 5px 0 rgba(0,0,0,.25)}
h1 .chalk{color:#fff;text-shadow:-2px -2px 0 var(--ball-dark),2px -2px 0 var(--ball-dark),-2px 2px 0 var(--ball-dark),2px 2px 0 var(--ball-dark),0 5px 0 rgba(0,0,0,.25)}
h2{font-family:var(--body);font-weight:800;font-size:18px;margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:var(--body);font-weight:800;font-size:16px;border:2px solid #1d3f8a;color:#1d3f8a;padding:8px 18px;border-radius:999px;cursor:pointer;
  background:linear-gradient(#ffffff,#d6e3fb);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 3px 0 #1d3f8a}
.tab[aria-selected="true"]{color:var(--gold);border-color:var(--ball-dark);background:radial-gradient(circle at 50% 20%,#4ee04e,var(--ball) 45%,var(--ball-dark));box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 3px 0 #004d00;text-shadow:0 1px 0 #004d00}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:3px solid #1d3f8a;border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0;box-shadow:0 6px 0 rgba(29,63,138,.35)}
.roster textarea{width:100%;min-height:300px;resize:vertical;font-family:var(--body);font-size:15px;line-height:1.6;
  background:#fffef3;color:var(--ink);border:2px inset #c9c2a0;border-radius:4px;padding:10px 12px;
  background-image:repeating-linear-gradient(transparent 0 23px,#e8e2c4 23px 24px);background-attachment:local;background-position:0 9px}
@media (max-width:820px){.roster textarea{min-height:140px}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.count{font-family:var(--display);font-weight:800;font-size:16px;color:var(--gold);background:radial-gradient(circle at 40% 25%,#4ee04e,var(--ball) 50%,var(--ball-dark));padding:2px 12px;border-radius:999px;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #004d00}
button,.btn{font-family:var(--body);font-weight:800;font-size:14px;border:2px solid #8a9bb8;color:#223;padding:6px 12px;border-radius:8px;cursor:pointer;line-height:1.2;
  background:linear-gradient(#ffffff 0,#ffffff 45%,#dfe6f2 55%,#cfd8e8);box-shadow:0 2px 0 #8a9bb8}
button:hover{filter:brightness(1.05)}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{font-size:17px;padding:9px 20px;color:#fff;border-color:var(--orange-dark);text-shadow:0 1px 0 #8a4600;
  background:linear-gradient(90deg,#e07800,#ffb240 30%,#ffd27a 42%,#ff9a00 55%,#e07800);box-shadow:0 4px 0 #a35200;border-radius:10px}
button.yellow{color:#5a3a00;border-color:#c9a000;background:linear-gradient(#fff7b0,#ffe14a 50%,#ffd000);box-shadow:0 3px 0 #b08a00}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=number]{width:64px;font-family:var(--display);font-weight:800;font-size:16px;padding:5px 8px;border-radius:4px;border:2px inset #b8c4d8;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:800}
label.chk input{width:18px;height:18px;accent-color:var(--ball)}
.view[hidden]{display:none!important}
.status{font-size:13px;font-weight:800;padding:3px 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel-2);font-variant-numeric:tabular-nums}
.status.ok{color:var(--ok);border-color:currentColor}
.status.bad{color:var(--danger);border-color:currentColor}
.sep{width:2px;height:24px;background:var(--line);opacity:.5}

/* 자리뽑기 */
.board-bar{background:var(--board);color:var(--board-ink);font-family:var(--display);font-weight:800;text-align:center;border:6px solid var(--wood);border-radius:4px;padding:6px;margin:0 auto 14px;width:min(440px,72%);letter-spacing:6px;box-shadow:0 3px 0 #6d4317;text-shadow:0 0 3px rgba(255,255,255,.4)}
.seatwrap{position:relative;padding:10px 6px;overflow:hidden;background:repeating-linear-gradient(90deg,#f7ecd6 0 38px,#f1e3c6 38px 40px);border-radius:10px;border:2px solid #d8c39a}
.grid{display:grid;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 auto;width:max-content}
.seat{border-radius:6px;border:2px dashed #b9c6dc;background:var(--seat-off);display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:800;color:#8a97ad;transition:background .12s,border-color .12s,transform .12s;overflow:hidden;padding:1px;white-space:pre-line;overflow-wrap:anywhere;line-height:1.15;cursor:pointer;min-width:0}
.grid.result{touch-action:pan-y}
.seat.on{background:linear-gradient(#ffe58a,var(--desk) 45%,#ffb42a);border:2px solid var(--desk-edge);color:#3a2300;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 0 #a86400}
.result .seat.on{font-family:var(--display)}
.seat.aisle{visibility:hidden}
.seat.empty{color:#a0702a;font-weight:400}
.seat.flick{transform:scale(.95)}
.result .seat{cursor:default}
.hint{font-size:13px;color:var(--muted);text-align:center}
.leftover{font-size:14px;font-weight:800;color:var(--danger)}

/* 조뽑기 */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gcard{border:2px solid var(--ball-dark);border-radius:12px;background:#fff;display:grid;gap:8px;align-content:start;overflow:hidden;box-shadow:0 4px 0 rgba(0,90,0,.3)}
.gcard h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;color:var(--gold);
  background:radial-gradient(ellipse at 50% 0,#4ee04e,var(--ball) 55%,var(--ball-dark));text-shadow:0 1px 0 #004d00}
.gcard .members{padding:0 10px 12px}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:28px;height:28px;padding:0;font-size:16px;border-radius:50%}
.step b{min-width:38px;text-align:center;font-variant-numeric:tabular-nums;color:#fff}
.members{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fffbe6;border:2px solid #f0c040;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:800}
.chip.ghost{border-style:dashed;border-color:#c9d3e4;background:#f5f8fd;color:#98a4b8}

/* 발표뽑기: 하늘·구름·언덕 무대 */
.stage{position:relative;height:340px;border-radius:12px;overflow:hidden;border:3px solid #1d3f8a;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot))}
.stage .cloud{opacity:.8}
.stage .hills{position:absolute;left:0;bottom:0;width:100%;height:42%}
.skunk{position:absolute;right:8%;bottom:9%;width:min(240px,46%);transform-origin:50% 100%;transition:right .4s}
.skunk .tail{transform-origin:72px 118px;transform:rotate(38deg);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.stage.lift .skunk .tail{transform:rotate(0deg)}
.stage.shake .skunk{animation:wob .12s 5 linear}
.stage.shake .skunk .tail{animation:wag .12s 5 linear}
@keyframes wob{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-3px) rotate(-2deg)}75%{transform:translateX(3px) rotate(2deg)}}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.skunk .eye-open{transition:opacity .1s}
.stage.shake .eye-open{opacity:0}
.eye-shut{opacity:0}
.stage.shake .eye-shut{opacity:1}
.puff{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--fart-2),var(--fart) 70%);opacity:0;transform:scale(0)}
.stage.blow .puff{animation:puff 1.9s ease-out forwards}
@keyframes puff{0%{opacity:0;transform:scale(0) translate(0,0)}18%{opacity:.95}60%{opacity:.9;transform:scale(1.15) translate(var(--dx),var(--dy))}100%{opacity:0;transform:scale(1.5) translate(calc(var(--dx)*1.6),calc(var(--dy)*1.6))}}
.stink{position:absolute;left:36%;top:22%;font-family:var(--display);font-weight:800;color:#5a8a00;font-size:28px;opacity:0;text-shadow:0 0 6px #fff}
.stage.blow .stink{animation:stink 1.4s ease-out .2s forwards}
@keyframes stink{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.namecard{position:absolute;left:32%;top:50%;width:min(210px,52vw);aspect-ratio:1;max-width:100%;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;
  background:radial-gradient(circle at 50% 30%,#3ef03e 0,var(--ball) 45%,var(--ball-dark) 100%);box-shadow:0 10px 18px rgba(0,40,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;filter:blur(4px);color:var(--gold)}
.namecard span{font-family:var(--display);font-weight:400;font-size:clamp(30px,6.5vw,52px);line-height:1.05;text-align:center;padding:0 14px;word-break:keep-all;text-shadow:0 2px 0 rgba(0,60,0,.4)}
.namecard small{font-family:var(--body);font-size:17px;color:#111;margin-top:8px}
.namecard small b{color:var(--gold);margin-right:6px;font-family:var(--display)}
.stage.blow .namecard{opacity:.7;transform:translate(-50%,-50%) scale(.5)}
.stage.reveal .namecard{opacity:1;filter:none;left:50%;top:44%;transform:translate(-50%,-50%) scale(1);transition:all .55s cubic-bezier(.3,1.7,.5,1)}
.stage.reveal .skunk{right:3%}
.stage-msg{position:absolute;left:0;right:0;top:36%;text-align:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 1px 2px #1d3f8a}
.stage.reveal .stage-msg,.stage.blow .stage-msg{display:none}
.history{display:flex;flex-wrap:wrap;gap:6px;counter-reset:h}
.history .chip::before{counter-increment:h;content:counter(h) ". ";color:var(--orange-dark)}
/* 자리·조뽑기용 스컹크 등장 */
.seatwrap,.blastzone{position:relative}
.blast{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.blast .bsk{position:absolute;right:3%;bottom:2%;width:min(190px,36%);transform:translateX(140%);transition:transform .45s ease-out;z-index:2}
.blast.in .bsk{transform:translateX(0)}
.blast.out .bsk{transform:translateX(140%);transition-duration:.35s}
.blast .tail{transform-origin:72px 118px;transform:rotate(38deg);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.blast.lift .tail{transform:rotate(0deg)}
.blast.shake .bsk{animation:wob .12s 4 linear}
.blast.shake .tail{animation:wag .12s 4 linear}
.blast .eye-shut{opacity:0}
.blast.shake .eye-open{opacity:0}.blast.shake .eye-shut{opacity:1}
.blast .bp{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--fart-2),var(--fart) 70%);transform:scale(0);opacity:0;z-index:1}
.blast.blow .bp{animation:bpuff 1.9s ease-out forwards}
@keyframes bpuff{0%{transform:scale(0);opacity:0}28%{transform:scale(1);opacity:.97}62%{transform:scale(1.08);opacity:.96}100%{transform:scale(1.35);opacity:0}}
.blast .bst{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,48px);color:#4d7a00;text-shadow:0 0 8px #fff,0 0 2px #fff;opacity:0;z-index:3}
.blast.blow .bst{animation:stink 1.5s ease-out .25s forwards}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fffbe0;color:#3a2300;border:3px solid var(--orange);padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,30,.55);display:grid;place-items:center;padding:20px;z-index:30}
.modal[hidden],[hidden]{display:none!important}
.modal .box{background:var(--panel);border:3px solid #1d3f8a;border-radius:14px;padding:16px;max-width:min(900px,100%);max-height:90vh;overflow:auto;display:grid;gap:10px}
.modal img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
</style>

<div class="scenery" aria-hidden="true"><div class="cloud" style="left:4%;top:16%;width:150px;height:46px"></div><div class="cloud" style="right:8%;top:8%;width:190px;height:52px"></div><div class="cloud" style="left:46%;top:40%;width:120px;height:36px"></div><svg viewBox="0 0 1000 170" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70 C200 20 420 40 560 110 L560 170 L0 170Z" fill="var(--hill)"/><path d="M380 170 C460 90 700 40 1000 60 L1000 170Z" fill="var(--hill-2)"/><path d="M0 70 C200 20 420 40 560 110" fill="none" stroke="#0a3a0a" stroke-width="2"/><path d="M380 170 C460 90 700 40 1000 60" fill="none" stroke="#0a3a0a" stroke-width="2"/></svg></div>
<div class="app">
  <header>
    <h1><span class="chalk">서컹크</span> 뽑기</h1>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-seat" aria-selected="true" data-view="seat">자리뽑기</button>
      <button class="tab" role="tab" id="tab-group" aria-selected="false" data-view="group">조뽑기</button>
      <button class="tab" role="tab" id="tab-pick" aria-selected="false" data-view="pick">발표뽑기</button>
    </nav>
  </header>

  <div class="layout">
    <aside class="panel roster">
      <div class="row spread"><h2>학생 명단</h2><span class="count" id="rosterCount">0명</span></div>
      <textarea id="roster" spellcheck="false" placeholder="한 줄에 한 명씩 입력하세요&#10;(쉼표로 구분해도 돼요)"></textarea>
      <div class="row"><span class="muted">번호로 채우기</span><input type="number" id="numCount" min="1" max="60" value="25"><span class="muted">명</span><button id="fillNums">채우기</button></div>
      <div class="row spread"><button id="clearRoster">명단 비우기</button><span class="muted" id="rosterNote"></span></div>
    </aside>

    <main class="panel">
      <!-- 자리뽑기 -->
      <section class="view" id="view-seat">
        <div class="row spread" style="margin-bottom:10px">
          <div class="row" id="seatEditBar">
            <span class="muted">세로</span><button id="rowMinus" aria-label="줄 줄이기">−</button><b id="rowsLbl">6</b><button id="rowPlus" aria-label="줄 늘리기">＋</button>
            <span class="sep"></span>
            <span class="muted">가로</span><button id="colMinus" aria-label="칸 줄이기">−</button><b id="colsLbl">6</b><button id="colPlus" aria-label="칸 늘리기">＋</button>
            <span class="sep"></span>
            <button id="selAll">전체 선택</button><button id="selNone">선택 해제</button><button id="selFit">학생 수만큼</button>
          </div>
          <span class="status" id="seatStatus"></span>
        </div>
        <div class="board-bar">칠 판 · 교 탁</div>
        <div class="seatwrap" id="seatWrap"><div class="grid" id="seatGrid"></div></div>
        <p class="hint" id="seatHint">드래그로 쓸 자리를 칠하세요. 칠한 자리를 다시 드래그하면 지워져요. 바깥쪽으로 끌면 칸이 늘어나요.</p>
        <p class="leftover" id="leftover" hidden></p>
        <div class="row" style="justify-content:center;margin-top:8px">
          <label class="chk"><input type="checkbox" id="seatOrder"> 번호순으로 앉히기</label>
          <button class="primary" id="seatGo">자리 배치하기</button>
          <button id="seatEdit" hidden>자리 다시 고르기</button>
          <button class="yellow" id="seatSave" hidden>이미지로 저장</button>
        </div>
      </section>

      <!-- 조뽑기 -->
      <section class="view" id="view-group" hidden>
        <div class="row spread" style="margin-bottom:12px">
          <div class="row"><span style="font-weight:700">조 개수</span><input type="number" id="gCount" min="1" max="20" value="4"><button id="gReset">인원 다시 나누기</button></div>
          <span class="status" id="gStatus"></span>
        </div>
        <div class="blastzone" id="gZone"><div class="groups" id="groups"></div></div>
        <p class="leftover" id="gLeft" hidden></p>
        <div class="row" style="justify-content:center;margin-top:14px">
          <button class="primary" id="gGo">조 뽑기</button>
          <button class="yellow" id="gSave" hidden>텍스트로 저장</button>
          <button id="gCopy" hidden>복사</button>
        </div>
      </section>

      <!-- 발표뽑기 -->
      <section class="view" id="view-pick" hidden>
        <div class="row spread" style="margin-bottom:12px">
          <div class="row">
            <label class="chk"><input type="checkbox" id="pRepeat"> 또 뽑힘 가능</label>
            <label class="chk"><input type="checkbox" id="pSound" checked> 소리</label>
          </div>
          <span class="status" id="pStatus"></span>
        </div>
        <div class="stage" id="stage">
          <div class="cloud" style="left:6%;top:14%;width:110px;height:34px"></div><div class="cloud" style="right:10%;top:10%;width:130px;height:38px"></div><svg class="hills" viewBox="0 0 600 140" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 C120 0 250 20 330 90 L330 140 L0 140Z" fill="var(--hill-dark)"/><path d="M180 140 C240 60 420 30 600 40 L600 140Z" fill="var(--hill-2)"/><path d="M180 140 C240 60 420 30 600 40" fill="none" stroke="#0a3a0a" stroke-width="1.5"/></svg>

            <rect x="124" y="164" width="18" height="28" rx="8" fill="var(--skunk)"/>

            <path d="M196 80 L190 64 L206 76 Z" fill="var(--skunk)"/>

<div class="modal" id="modal" hidden><div class="box"><div class="row spread"><b>이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요</b><button id="modalClose">닫기</button></div><img id="modalImg" alt="자리 배치 이미지"></div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('pick:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('pick:'+k,JSON.stringify(v))}catch(e){}}};
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 파일 저장 ---------- */
async function saveFile(filename,data){
  let dl=null;
  if(window.claude&&window.claude.use){try{dl=await window.claude.use('downloads')}catch(e){}}
  if(dl){
    try{await dl.save({filename,data});toast('저장했어요');return true}
    catch(e){if(e&&e.code==='declined'){toast('저장을 취소했어요');return true}}
  }
  try{const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}catch(e){}
  return false;
}

/* ---------- 명단 ---------- */
const SAMPLE=['김민준','이서연','박도윤','최하은','정시우','강지유','조하준','윤서아','장예준','임수아','한주원','오지호','서채원','신유나','권건우','황다은','안우진','송지안','전태민','홍나윤','유하람','고은찬','문소율','양시현'];
const ta=$('#roster');
let names=[];
ta.value=store.get('roster',SAMPLE.join('\n'));
$('#rosterNote').textContent=store.get('roster',null)==null?'예시 명단이에요':'';
function parse(){names=ta.value.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);$('#rosterCount').textContent=names.length+'명'}
ta.addEventListener('input',()=>{parse();store.set('roster',ta.value);$('#rosterNote').textContent='';onRoster()});
$('#fillNums').onclick=()=>{const n=Math.max(1,Math.min(60,+$('#numCount').value||0));ta.value=Array.from({length:n},(_,i)=>(i+1)+'번').join('\n');ta.dispatchEvent(new Event('input'))};
$('#clearRoster').onclick=()=>{ta.value='';ta.dispatchEvent(new Event('input'));ta.focus()};
function onRoster(){seatStatus();if(!groupsDrawn){defaultSizes()}renderGroups();pickStatus()}

/* ---------- 탭 ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='view-'+t.dataset.view);
  store.set('tab',t.dataset.view);if(t.dataset.view==='seat')renderSeats();
});

/* ---------- 자리뽑기 ---------- */
const S={rows:store.get('rows',6),cols:store.get('cols',6),on:new Set(store.get('on',null)||[...Array(24)].map((_,i)=>Math.floor(i/6)+'-'+(i%6))),mode:'edit',map:{}};
const MAX=14;
const grid=$('#seatGrid'),wrap=$('#seatWrap');
const key=(r,c)=>r+'-'+c;
function saveSeats(){store.set('rows',S.rows);store.set('cols',S.cols);store.set('on',[...S.on])}
function activeKeys(){return [...S.on].map(k=>k.split('-').map(Number)).filter(([r,c])=>r<S.rows&&c<S.cols).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(([r,c])=>key(r,c))}
function seatStatus(){const n=activeKeys().length,el=$('#seatStatus');el.textContent='자리 '+n+' / 학생 '+names.length;el.className='status '+(n===names.length?'ok':n<names.length?'bad':'')}
function sizeFor(cols,rows){
  // 가로는 항상 화면 안에 맞춤(밖으로 늘어나지 않음). 칸이 좁아지면 대신 세로로 길쭉하게 해서 이름 공간 확보
  const W=wrap.clientWidth-14,H=Math.max(300,Math.min(window.innerHeight*.65,700));
  const gap=cols>12?3:cols>9?4:8,ratio=.62;
  let w=Math.min(170,(W-gap*(cols-1))/cols),h=w*ratio;
  if(h*rows+gap*(rows-1)>H)h=Math.max((H-gap*(rows-1))/rows,w*.45);
  h=Math.max(h,Math.min(58,30+w*.35),26);
  return {w:Math.max(8,Math.floor(w)),h:Math.floor(h),gap,fs:Math.max(9,Math.min(22,w*.17,h*.4))};
}
/* 이름 맞추기: 한 줄로 줄이거나, 길면 두 줄로 나눠서 글자 크기 결정 */
const NAME_FONT='"Nanum Myeongjo","Batang","AppleMyungjo",serif';
const mctx=document.createElement('canvas').getContext('2d');
function splitName(s,n){
  if(n<=1)return [s];
  const words=s.split(/\s+/).filter(Boolean);
  if(words.length>=n){ // 띄어쓰기 기준으로 균형 있게 나누기
    const total=words.join('').length,out=[];let cur='',acc=0,left=n;
    words.forEach((w,i)=>{const rest=words.length-i;if(cur&&(acc+w.length>total/n*(n-left+1)+.5||rest<left)){out.push(cur);cur=w;left--}else cur=cur?cur+' '+w:w;acc+=w.length});
    out.push(cur);if(out.length===n)return out;
  }
  const t=s.replace(/\s+/g,''),k=Math.ceil(t.length/n),out=[];
  for(let i=0;i<t.length;i+=k)out.push(t.slice(i,i+k));return out;
}
function fitLabel(label,maxW,maxH,base,min){
  mctx.font=`800 100px ${NAME_FONT}`;
  const len=label.replace(/\s+/g,'').length;let best=null;
  for(let n=1;n<=Math.min(8,len);n++){
    const L=splitName(label,n),w=Math.max(...L.map(t=>mctx.measureText(t).width))||1;
    const fs=Math.min(base,100*maxW/w,maxH/(n*1.15));
    if(!best||fs>best.fs*1.08)best={fs,lines:L};
  }
  return {fs:Math.max(min,Math.floor(best.fs)),lines:best.lines};
}
// 칸이 아주 좁을 때(휴대폰 등): 가장 긴 이름이 읽을 만한 크기(9px)로 들어가도록 자리 높이를 늘림
function needHeight(maxW){
  const fs=9;mctx.font=`800 ${fs}px ${NAME_FONT}`;let most=1;
  [...names,'빈자리'].forEach(n=>{const t=n.replace(/\s+/g,'');let lines=1,cur=0;
    for(const ch of t){const cw=mctx.measureText(ch).width;if(cur+cw>maxW&&cur>0){lines++;cur=cw}else cur+=cw}
    most=Math.max(most,lines)});
  return Math.min(160,Math.ceil(most*fs*1.12+6));
}
function renderSeats(){
  let r0=0,c0=0,rows=S.rows,cols=S.cols;
  const act=activeKeys();
  if(S.mode==='result'&&act.length){
    const rs=act.map(k=>+k.split('-')[0]),cs=act.map(k=>+k.split('-')[1]);
    r0=Math.min(...rs);c0=Math.min(...cs);rows=Math.max(...rs)-r0+1;cols=Math.max(...cs)-c0+1;
  }
  const z=sizeFor(cols,rows);
  if(S.mode==='result')z.h=Math.max(z.h,needHeight(z.w-8));
  grid.style.gridTemplateColumns=`repeat(${cols},${z.w}px)`;grid.style.gridAutoRows=z.h+'px';grid.style.gap=z.gap+'px';grid.style.fontSize=z.fs+'px';
  const frag=document.createDocumentFragment();
  for(let r=r0;r<r0+rows;r++)for(let c=c0;c<c0+cols;c++){
    const d=document.createElement('div'),k=key(r,c),on=S.on.has(k);d.className='seat'+(on?' on':'');d.dataset.k=k;
    if(S.mode==='result'){if(!on)d.classList.add('aisle');else{const n=S.map[k],label=n||'빈자리';
      const f=fitLabel(label,Math.max(4,z.w-8),z.h-6,z.fs,6);d.style.fontSize=f.fs+'px';d.style.lineHeight='1.12';d.textContent=f.lines.join('\n');d.title=label;if(!n)d.classList.add('empty')}}
    frag.appendChild(d);
  }
  grid.replaceChildren(frag);grid.classList.toggle('result',S.mode==='result');
  $('#rowsLbl').textContent=S.rows;$('#colsLbl').textContent=S.cols;seatStatus();
}
new ResizeObserver(()=>{if(!$('#view-seat').hidden)renderSeats()}).observe(wrap);
function addRow(top){if(S.rows>=MAX)return false;if(top)S.on=new Set([...S.on].map(k=>{const[r,c]=k.split('-').map(Number);return key(r+1,c)}));S.rows++;return true}
function addCol(left){if(S.cols>=MAX)return false;if(left)S.on=new Set([...S.on].map(k=>{const[r,c]=k.split('-').map(Number);return key(r,c+1)}));S.cols++;return true}
$('#rowPlus').onclick=()=>{addRow(false);saveSeats();renderSeats()};
$('#colPlus').onclick=()=>{addCol(false);saveSeats();renderSeats()};
$('#rowMinus').onclick=()=>{if(S.rows>1){S.rows--;S.on=new Set(activeKeys());saveSeats();renderSeats()}};
$('#colMinus').onclick=()=>{if(S.cols>1){S.cols--;S.on=new Set(activeKeys());saveSeats();renderSeats()}};
$('#selAll').onclick=()=>{S.on=new Set();for(let r=0;r<S.rows;r++)for(let c=0;c<S.cols;c++)S.on.add(key(r,c));saveSeats();renderSeats()};
$('#selNone').onclick=()=>{S.on=new Set();saveSeats();renderSeats()};
$('#selFit').onclick=()=>{const n=names.length;if(!n){toast('명단을 먼저 입력하세요');return}
  while(S.rows*S.cols<n&&(S.rows<MAX||S.cols<MAX)){if(S.cols<=S.rows&&S.cols<MAX)S.cols++;else S.rows++}
  S.on=new Set();for(let i=0;i<n;i++)S.on.add(key(Math.floor(i/S.cols),i%S.cols));saveSeats();renderSeats()};

// 드래그 칠하기
let drag=null;
grid.addEventListener('pointerdown',e=>{
  if(S.mode!=='edit')return;const cell=e.target.closest('.seat');if(!cell)return;
  e.preventDefault();grid.setPointerCapture(e.pointerId);
  drag={paint:!S.on.has(cell.dataset.k),last:0};apply(cell);
});
grid.addEventListener('pointermove',e=>{
  if(!drag)return;
  const el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest&&el.closest('.seat');
  if(cell&&grid.contains(cell)){apply(cell);return}
  const r=grid.getBoundingClientRect(),now=performance.now();
  if(now-drag.last<260)return;
  let grew=false;
  if(e.clientX>r.right+6)grew=addCol(false)||grew;else if(e.clientX<r.left-6)grew=addCol(true)||grew;
  if(e.clientY>r.bottom+6)grew=addRow(false)||grew;else if(e.clientY<r.top-6)grew=addRow(true)||grew;
  if(grew){drag.last=now;renderSeats();const el2=document.elementFromPoint(Math.min(Math.max(e.clientX,r.left+2),r.right-2),Math.min(Math.max(e.clientY,r.top+2),r.bottom-2));}
});
const end=()=>{if(drag){drag=null;saveSeats()}};
grid.addEventListener('pointerup',end);grid.addEventListener('pointercancel',end);
function apply(cell){const k=cell.dataset.k;if(drag.paint)S.on.add(k);else S.on.delete(k);cell.classList.toggle('on',drag.paint);seatStatus()}

let blasting=false;
function skunkBlast(zone,mid,done){
  if(reduce){mid();done&&done();return}
  blasting=true;['#seatGo','#gGo'].forEach(b=>$(b).disabled=true);
  const o=document.createElement('div');o.className='blast';
  const W=zone.clientWidth,H=Math.max(zone.clientHeight,160),sz=Math.max(W,H)*.42;
  for(let r=0;r<3;r++)for(let c=0;c<5;c++){
    const b=document.createElement('div');b.className='bp';
    const x=(c/4)*W+(Math.random()-.5)*sz*.3-sz/2,y=(r/2)*H+(Math.random()-.5)*sz*.3-sz/2;
    b.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;animation-delay:${((4-c)/4*.4+Math.random()*.1).toFixed(2)}s`;
    o.appendChild(b);
  }
  const t=document.createElement('div');t.className='bst';t.textContent='~ 뿌우웅 ~';o.appendChild(t);
  const sk=document.querySelector('.stage .skunk').cloneNode(true);sk.setAttribute('class','bsk');o.appendChild(sk);
  zone.appendChild(o);void o.offsetWidth;o.classList.add('in');
  setTimeout(()=>o.classList.add('lift'),450);
  setTimeout(()=>o.classList.add('shake'),800);
  setTimeout(()=>{o.classList.remove('shake');o.classList.add('blow');fart()},1300);
  setTimeout(mid,2050);
  setTimeout(()=>o.classList.add('out'),2500);
  setTimeout(()=>{o.remove();blasting=false;['#seatGo','#gGo'].forEach(b=>$(b).disabled=false);done&&done()},3300);
}
$('#seatGo').onclick=()=>{
  const act=activeKeys();if(!act.length){toast('쓸 자리를 먼저 드래그로 칠하세요');return}
  if(!names.length){toast('학생 명단을 입력하세요');return}
  const list=$('#seatOrder').checked?names.slice():shuffle(names);
  S.map={};act.forEach((k,i)=>S.map[k]=list[i]||'');
  const left=list.slice(act.length);
  $('#leftover').hidden=!left.length;$('#leftover').textContent=left.length?`자리가 ${left.length}개 부족해요. 못 앉은 학생: ${left.join(', ')}`:'';
  S.mode='result';
  const final=S.map;
  ['#seatEditBar','#seatHint'].forEach(s=>$(s).style.visibility='hidden');
  $('#seatEdit').hidden=false;$('#seatSave').hidden=false;$('#seatGo').textContent='다시 배치하기';
  if(reduce){renderSeats();return}
  if(blasting)return;
  S.map={};const iv=setInterval(()=>{
    act.forEach(k=>S.map[k]=names[Math.floor(Math.random()*names.length)]);renderSeats();
    grid.querySelectorAll('.seat.on').forEach(c=>c.classList.add('flick'));
  },90);
  skunkBlast(wrap,()=>{clearInterval(iv);S.map=final;renderSeats()});
};
$('#seatEdit').onclick=()=>{S.mode='edit';S.map={};['#seatEditBar','#seatHint'].forEach(s=>$(s).style.visibility='');$('#seatEdit').hidden=true;$('#seatSave').hidden=true;$('#leftover').hidden=true;$('#seatGo').textContent='자리 배치하기';renderSeats()};

$('#seatSave').onclick=async()=>{
  await document.fonts.ready;
  const act=activeKeys(),rs=act.map(k=>+k.split('-')[0]),cs=act.map(k=>+k.split('-')[1]);
  const r0=Math.min(...rs),c0=Math.min(...cs),rows=Math.max(...rs)-r0+1,cols=Math.max(...cs)-c0+1;
  const cw=150,ch=92,gap=14,pad=44,top=150,sc=2;
  const W=Math.max(cols*cw+(cols-1)*gap+pad*2,520),H=top+rows*ch+(rows-1)*gap+pad;
  const cv=document.createElement('canvas');cv.width=W*sc;cv.height=H*sc;const x=cv.getContext('2d');x.scale(sc,sc);
  const sg=x.createLinearGradient(0,0,0,H);sg.addColorStop(0,'#3d6fd6');sg.addColorStop(1,'#c4d8f6');x.fillStyle=sg;x.fillRect(0,0,W,H);
  x.fillStyle='#ffd400';x.strokeStyle='#6a4a00';x.lineWidth=5;x.font='800 32px "Nanum Myeongjo", serif';x.textAlign='left';x.strokeText('자리 배치',pad,56);x.textBaseline='alphabetic';x.fillText('자리 배치',pad,56);
  x.fillStyle='#ffffff';x.font='800 16px "Nanum Gothic", sans-serif';x.textAlign='right';x.fillText(today()+' · '+names.length+'명',W-pad,56);
  const bw=Math.min(380,W*.6);rr(x,(W-bw)/2,80,bw,38,8);x.fillStyle='#a8692b';x.fill();rr(x,(W-bw)/2+5,85,bw-10,28,3);x.fillStyle='#24502a';x.fill();
  x.fillStyle='#ffffff';x.font='800 18px "Nanum Myeongjo", serif';x.textAlign='center';x.textBaseline='middle';x.fillText('칠  판  ·  교  탁',W/2,100);
  const ox=(W-(cols*cw+(cols-1)*gap))/2;
  act.forEach(k=>{const[r,c]=k.split('-').map(Number);const px=ox+(c-c0)*(cw+gap),py=top+(r-r0)*(ch+gap);
    rr(x,px,py+4,cw,ch,10);x.fillStyle='#a86400';x.fill();rr(x,px,py,cw,ch,10);const dg=x.createLinearGradient(0,py,0,py+ch);dg.addColorStop(0,'#ffe58a');dg.addColorStop(.45,'#ffc94a');dg.addColorStop(1,'#ffb42a');x.fillStyle=dg;x.fill();x.strokeStyle='#d98a00';x.lineWidth=2;x.stroke();
    const n=S.map[k];x.fillStyle=n?'#3a2300':'#a0702a';const label=n||'빈자리';
    const f=fitLabel(label,cw-16,ch-12,26,10);x.font=`800 ${f.fs}px ${NAME_FONT}`;
    const lh=f.fs*1.18;f.lines.forEach((t,i)=>x.fillText(t,px+cw/2,py+ch/2+(i-(f.lines.length-1)/2)*lh))});
  cv.toBlob(async b=>{const ok=await saveFile('자리배치_'+today()+'.png',b);if(!ok){$('#modalImg').src=cv.toDataURL('image/png');$('#modal').hidden=false}},'image/png');
};
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
$('#modalClose').onclick=()=>$('#modal').hidden=true;

/* ---------- 조뽑기 ---------- */
let gSizes=store.get('gSizes',null),groupsDrawn=null;
const gCount=$('#gCount');gCount.value=store.get('gCount',4);
function defaultSizes(){const k=Math.max(1,Math.min(20,+gCount.value||1)),n=names.length,b=Math.floor(n/k),r=n%k;gSizes=Array.from({length:k},(_,i)=>b+(i<r?1:0));store.set('gSizes',gSizes)}
function renderGroups(){
  if(!gSizes||gSizes.length!==(+gCount.value||1))defaultSizes();
  const sum=gSizes.reduce((a,b)=>a+b,0),el=$('#gStatus');
  el.textContent='배정 '+sum+' / 학생 '+names.length;el.className='status '+(sum===names.length?'ok':'bad');
  const box=$('#groups');box.replaceChildren();
  gSizes.forEach((sz,i)=>{
    const c=document.createElement('div');c.className='gcard';
    c.innerHTML=`<h3><span>${i+1}조</span><span class="step"><button data-i="${i}" data-d="-1" aria-label="${i+1}조 한 명 빼기">−</button><b>${sz}명</b><button data-i="${i}" data-d="1" aria-label="${i+1}조 한 명 더하기">＋</button></span></h3>`;
    const m=document.createElement('div');m.className='members';
    const mem=groupsDrawn?groupsDrawn[i]:null;
    for(let j=0;j<sz;j++){const s=document.createElement('span');s.className='chip'+(mem&&mem[j]?'':' ghost');s.textContent=mem?(mem[j]||'빈자리'):'?';m.appendChild(s)}
    c.appendChild(m);box.appendChild(c);
  });
  const left=groupsDrawn?groupsDrawn.left:[];$('#gLeft').hidden=!left.length;$('#gLeft').textContent=left.length?'조에 못 들어간 학생: '+left.join(', '):'';
}
$('#groups').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const i=+b.dataset.i;gSizes[i]=Math.max(0,gSizes[i]+(+b.dataset.d));store.set('gSizes',gSizes);clearGroups();renderGroups()});
gCount.addEventListener('input',()=>{store.set('gCount',+gCount.value);clearGroups();defaultSizes();renderGroups()});
$('#gReset').onclick=()=>{clearGroups();defaultSizes();renderGroups()};
function clearGroups(){groupsDrawn=null;$('#gSave').hidden=$('#gCopy').hidden=true;$('#gGo').textContent='조 뽑기'}
$('#gGo').onclick=()=>{
  if(!names.length){toast('학생 명단을 입력하세요');return}
  if(blasting)return;
  const list=shuffle(names);let p=0;const fin=gSizes.map(sz=>{const g=list.slice(p,p+sz);p+=sz;return g});fin.left=list.slice(p);
  const show=()=>{groupsDrawn=fin;renderGroups();$('#gSave').hidden=$('#gCopy').hidden=false;$('#gGo').textContent='다시 뽑기'};
  if(reduce){show();return}
  $('#gSave').hidden=$('#gCopy').hidden=true;
  const iv=setInterval(()=>{const r=shuffle(names);let q=0;groupsDrawn=gSizes.map(sz=>{const g=r.slice(q,q+sz);q+=sz;return g});groupsDrawn.left=[];renderGroups()},90);
  skunkBlast($('#gZone'),()=>{clearInterval(iv);show()});
};
function groupText(){let t=`조 편성 (${today()})\n\n`;groupsDrawn.forEach((g,i)=>{t+=`${i+1}조 (${g.length}명): ${g.join(', ')}\n`});if(groupsDrawn.left.length)t+=`\n미배정: ${groupsDrawn.left.join(', ')}\n`;return t}
$('#gSave').onclick=async()=>{const ok=await saveFile('조편성_'+today()+'.txt',groupText());if(!ok)copy(groupText())};
$('#gCopy').onclick=()=>copy(groupText());
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('복사했어요. 붙여넣기 하세요')).catch(()=>toast('복사가 막혀 있어요'))}

/* ---------- 발표뽑기 ---------- */
const stage=$('#stage'),card=$('#nameTxt');
let drawn=[],busy=false;
$('#pRepeat').checked=store.get('repeat',false);$('#pSound').checked=store.get('sound',true);
$('#pRepeat').onchange=()=>{store.set('repeat',$('#pRepeat').checked);pickStatus()};
$('#pSound').onchange=()=>store.set('sound',$('#pSound').checked);
function pool(){if($('#pRepeat').checked)return names.slice();const used=drawn.slice();return names.filter(n=>{const i=used.indexOf(n);if(i>=0){used.splice(i,1);return false}return true})}
function pickStatus(){const el=$('#pStatus');el.textContent=$('#pRepeat').checked?'전체 '+names.length+'명에서 뽑기':'남은 학생 '+pool().length+' / '+names.length;el.className='status'}
function renderHistory(){const h=$('#history');h.replaceChildren(...drawn.map(n=>{const s=document.createElement('span');s.className='chip';s.textContent=n;return s}))}
$('#pReset').onclick=()=>{drawn=[];renderHistory();pickStatus();stage.className='stage';card.textContent='?';$('#nth').textContent=0};
let ac=null;
function fart(){
  if(!$('#pSound').checked)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,d=.9;
    const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter(),l=ac.createOscillator(),lg=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(55,t+d);
    l.frequency.value=22;lg.gain.value=30;l.connect(lg);lg.connect(o.frequency);
    f.type='lowpass';f.frequency.value=420;f.Q.value=6;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.04);g.gain.setValueAtTime(.45,t+d*.6);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t);l.start(t);o.stop(t+d);l.stop(t+d);
    const pop=ac.createOscillator(),pg=ac.createGain();pop.type='triangle';pop.frequency.setValueAtTime(600,t+d+.9);pop.frequency.exponentialRampToValueAtTime(1200,t+d+1);
    pg.gain.setValueAtTime(0,t+d+.9);pg.gain.linearRampToValueAtTime(.25,t+d+.92);pg.gain.exponentialRampToValueAtTime(.001,t+d+1.15);pop.connect(pg);pg.connect(ac.destination);pop.start(t+d+.9);pop.stop(t+d+1.2);
  }catch(e){}
}
$('#pGo').onclick=()=>{
  if(busy)return;if(!names.length){toast('학생 명단을 입력하세요');return}
  const p=pool();if(!p.length){toast('모두 한 번씩 뽑혔어요. "처음부터"를 누르세요');return}
  const pick=p[Math.floor(Math.random()*p.length)];busy=true;$('#pGo').disabled=true;
  const done=()=>{card.textContent=pick;stage.classList.add('reveal');drawn.push(pick);$('#nth').textContent=drawn.length;renderHistory();pickStatus();busy=false;$('#pGo').disabled=false};
  stage.className='stage';void stage.offsetWidth;
  if(reduce){stage.classList.add('blow');done();return}
  stage.classList.add('lift');
  setTimeout(()=>{stage.classList.add('shake')},450);
  setTimeout(()=>{fart();stage.classList.remove('shake');stage.classList.add('blow');
    const iv=setInterval(()=>card.textContent=p[Math.floor(Math.random()*p.length)],80);
    setTimeout(()=>{clearInterval(iv);done()},1000);
  },1050);
};

/* ---------- 시작 ---------- */
parse();renderGroups();pickStatus();renderSeats();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!$('#view-seat').hidden)renderSeats()});
const tab=store.get('tab','seat');const tb=document.querySelector(`.tab[data-view="${tab}"]`);if(tb)tb.click();
})();
</script>

</body></html>
